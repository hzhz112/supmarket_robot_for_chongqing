<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>零售抓取运行台</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title{font-size:28px;font-weight:800}.sub{color:#728096}.actions{display:flex;gap:10px}button{border:0;border-radius:10px;padding:11px 17px;font-weight:700;cursor:pointer;background:#fff;color:#25324a;box-shadow:0 3px 12px #dce3ef}button.primary{background:#3267e8;color:#fff}button.danger{background:#ffe9ed;color:#be123c}.layout{display:grid;grid-template-columns:1fr 330px;gap:20px}.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 28px #dfe6f1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.product{min-height:110px;text-align:center;font-size:16px}.product.sel{outline:3px solid #4c7cf0;background:#edf3ff;color:#2155cc}.tag{display:block;color:#8390a5;font-size:12px;margin-top:7px}.log{height:540px;background:#101827;color:#d5e4ff;border-radius:12px;padding:14px;overflow:auto;white-space:pre-wrap;font:12px ui-monospace,monospace}.status{padding:11px;background:#f2f6fc;border-radius:10px;margin-bottom:14px}.progress{margin-top:15px;color:#52627b}@media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="top"><div><div class="title">零售抓取运行台</div><div class="sub">局域网自动抓取 · 左手接口</div></div><div class="actions"><button onclick="power(true)">上使能</button><button onclick="power(false)">下使能</button><button class="danger" onclick="stop()">停止任务</button></div></div><div class="layout"><main class="panel"><h3>选择商品</h3><div id="grid" class="grid"></div><div class="status" id="selected">请选择一个商品</div><button class="primary" onclick="start()">确认并开始执行</button><div class="progress" id="progress">等待操作</div></main><aside class="panel"><h3>实时日志</h3><div id="log" class="log"></div></aside></div></div><script>
let selected=null;const grid=document.querySelector('#grid'),logbox=document.querySelector('#log');fetch('/api/products').then(r=>r.json()).then(xs=>xs.forEach(x=>{let b=document.createElement('button');b.className='product';b.innerHTML=x.name+'<span class="tag">'+x.shelf_layer+' · '+(x.hand||'未设置')+'手</span>';b.onclick=()=>{selected=x;document.querySelectorAll('.product').forEach(y=>y.classList.remove('sel'));b.classList.add('sel');document.querySelector('#selected').textContent='已选择：'+x.name};grid.appendChild(b)}));function call(u,o={}){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},...o}).then(r=>r.json()).then(x=>{if(x.error)alert(x.error);return x})}function power(x){call('/api/power/'+x)}function stop(){call('/api/stop')}function start(){if(!selected)return alert('请先选择商品');call('/api/start/'+encodeURIComponent(selected.name)).then(()=>document.querySelector('#progress').textContent='流程运行中…')}function render(xs){xs.forEach(x=>{logbox.textContent+=x+'\n'});logbox.scrollTop=logbox.scrollHeight}let ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=e=>{let x=JSON.parse(e.data);render(x.logs||[]);document.querySelector('#progress').textContent=x.running?'流程运行中…':'等待操作'};
const cam=document.createElement('img');cam.src='/api/camera.jpg';cam.style='width:100%;aspect-ratio:4/3;object-fit:cover;background:#111827;border-radius:12px;margin-bottom:14px';document.querySelector('aside').prepend(cam);setInterval(()=>cam.src='/api/camera.jpg?t='+Date.now(),1000);
// 商品图片：按 grasp_catalog.yaml 的 label 对应 static/images/{label}.png。
const displayStyle=document.createElement('style');displayStyle.textContent='.tag{display:none}.sub{display:none}.product img{height:90px !important}';document.head.appendChild(displayStyle);
setTimeout(()=>{fetch('/api/products').then(r=>r.json()).then(xs=>{document.querySelectorAll('.product').forEach((b,i)=>{const x=xs[i];if(!x)return;const img=document.createElement('img');img.src='/static/images/'+encodeURIComponent(x.label)+'.png';img.style='width:100%;height:72px;object-fit:contain';img.onerror=()=>img.remove();b.prepend(img)})})},100);
// 临时调试：通过网页输入控制最多执行到哪一步（1-10）。
const stepLabel=document.createElement('label');stepLabel.textContent=' 最大执行步骤（1-10）：';const stepInput=document.createElement('input');stepInput.id='maxStep';stepInput.type='number';stepInput.min='1';stepInput.max='10';stepInput.value='10';stepInput.style='width:70px;margin:8px';stepLabel.appendChild(stepInput);document.querySelector('.status').after(stepLabel);const oldStart=start;start=function(){if(!selected)return alert('请先选择商品');const n=Math.max(1,Math.min(10,parseInt(stepInput.value||'10',10)));call('/api/start/'+encodeURIComponent(selected.name)+'?max_step='+n).then(x=>{if(x.ok)document.querySelector('#progress').textContent='流程运行中…（最多第'+n+'步）'})};
const endTools=document.createElement('div');endTools.style='display:flex;flex-wrap:wrap;gap:8px;margin:14px 0';[['left','open','左夹爪 开'],['left','close','左夹爪 合'],['right','open','右灵巧手 开'],['right','close','右灵巧手 合']].forEach(([h,a,t])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>call('/api/gripper/'+h+'/'+a);endTools.appendChild(b)});document.querySelector('.actions').after(endTools);
const clearLogs=document.createElement('button');clearLogs.textContent='清除日志';clearLogs.onclick=()=>{logbox.textContent='';clearLogs.disabled=true;fetch('/api/logs/clear',{method:'POST'}).then(r=>r.json()).then(x=>{if(!x.ok&&x.error)alert(x.error);logbox.textContent=''}).catch(e=>alert('清除日志失败：'+e)).finally(()=>{clearLogs.disabled=false})};document.querySelector('.actions').appendChild(clearLogs);
const boxTools=document.createElement('div');boxTools.innerHTML='<hr><h3>箱子操作</h3><div id="boxGrid" class="grid"></div><div class="status" id="selectedBox">请选择第一层或第二层箱子</div><label>箱子最大步骤（1-8）：<input id="boxStep" type="number" min="1" max="8" value="8" style="width:70px;margin:8px"></label><button onclick="boxAction(\'grasp\')">抓取箱子</button><button onclick="boxAction(\'place\')">放置箱子</button>';document.querySelector('main').appendChild(boxTools);let selectedBox=null;fetch('/api/boxes').then(r=>r.json()).then(xs=>xs.forEach(x=>{const b=document.createElement('button');b.className='product';b.textContent=x.name;b.onclick=()=>{selectedBox=x;document.querySelectorAll('#boxGrid .product').forEach(y=>y.classList.remove('sel'));b.classList.add('sel');document.querySelector('#selectedBox').textContent='已选择：'+x.name};document.querySelector('#boxGrid').appendChild(b)}));function boxAction(action){if(!selectedBox)return alert('请先选择第一层或第二层箱子');const n=Math.max(1,Math.min(8,parseInt(document.querySelector('#boxStep').value||'8',10)));call('/api/box/'+selectedBox.box_layer+'/'+action+'?max_step='+n)}
</script></body></html>
